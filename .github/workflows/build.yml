name: Build and Release

on:
  push:
    branches:
      - "26.1.2"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: BiggerReactors
          fetch-depth: 0

      - name: Checkout Phosphophyllite
        uses: actions/checkout@v4
        with:
          repository: Modern-Mods/Phosphophyllite-Revived
          ref: 26.1.2
          path: Phosphophyllite

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: Modern-Mods/Quartz-Revived
          ref: 26.1.2
          path: Quartz

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Read Version
        id: gradle_props
        working-directory: BiggerReactors
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: BiggerReactors
        run: chmod +x gradlew

      - name: Build
        working-directory: BiggerReactors
        run: ./gradlew build

      - name: Create Tag
        working-directory: BiggerReactors
        run: |
          git tag v${{ steps.gradle_props.outputs.release_version }}
          git push origin v${{ steps.gradle_props.outputs.release_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gradle_props.outputs.release_version }}
          name: Bigger Reactors ${{ steps.gradle_props.outputs.release_version }}
          generate_release_notes: true
          files: |
            BiggerReactors/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
