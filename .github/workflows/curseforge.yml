name: Build & Publish to CurseForge

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mod version (e.g. 1.0.1)"
        required: true
        type: string
      release_type:
        description: "CurseForge release type"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: "Changelog (leave empty to use this version's section from changelog.md)"
        required: false
        type: string
      commit_version:
        description: "Commit the new mod_version to gradle.properties"
        required: false
        default: true
        type: boolean
      publish:
        description: "Upload to CurseForge (uncheck to only build the jar)"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  # Phosphophyllite is included from ../Phosphophyllite in settings.gradle
  PHOS_REPO: Modern-Mods/Phosphophyllite-Revived
  PHOS_REF: "1.21.1"
  # Comma-separated CurseForge slugs of required dependencies, e.g. "phosphophyllite-revived"
  # Leave empty if none. A wrong slug makes the upload fail.
  CF_REQUIRED_DEPENDENCIES: ""

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Quartz
    outputs:
      jar_name: ${{ steps.props.outputs.jar_name }}
      mc_version: ${{ steps.props.outputs.mc_version }}
      loader: ${{ steps.props.outputs.loader }}
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          path: Quartz
          fetch-depth: 0

      - name: Checkout Phosphophyllite
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PHOS_REPO }}
          ref: ${{ env.PHOS_REF }}
          path: Phosphophyllite

      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow from a branch (not a tag) so the version can be committed"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected something like 1.0.1 or 1.0.1-beta.1)"
            exit 1
          fi

      - name: Set mod_version in gradle.properties
        id: props
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Replace the value, keeping the original line ending (LF or CRLF)
          perl -pi -e 's/^mod_version=.*?(\r?)$/mod_version=$ENV{VERSION}$1/' gradle.properties

          if ! tr -d '\r' < gradle.properties | grep -qx "mod_version=${VERSION}"; then
            echo "::error::Could not set mod_version in gradle.properties (is the mod_version= line missing?)"
            exit 1
          fi

          prop() { grep -E "^$1=" gradle.properties | head -n1 | cut -d= -f2- | tr -d '\r'; }
          MOD_NAMED=$(prop mod_named)
          MC_VERSION=$(prop mcversion)
          LOADER=$(prop tag_lanzador)

          # Matches build.gradle: archivesName = mod_named, version = mcversion-mod_version-tag_lanzador
          JAR_NAME="${MOD_NAMED}-${MC_VERSION}-${VERSION}-${LOADER}.jar"

          {
            echo "jar_name=${JAR_NAME}"
            echo "mc_version=${MC_VERSION}"
            echo "loader=${LOADER}"
          } >> "$GITHUB_OUTPUT"

          echo "Expected jar: ${JAR_NAME}"
          git diff -- gradle.properties || true

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Check jar
        env:
          JAR_NAME: ${{ steps.props.outputs.jar_name }}
        run: |
          if [ ! -f "build/libs/${JAR_NAME}" ]; then
            echo "::error::Expected build/libs/${JAR_NAME} but it wasn't there"
            ls -la build/libs
            exit 1
          fi
          echo "Built: ${JAR_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.props.outputs.jar_name }}
          path: Quartz/build/libs/${{ steps.props.outputs.jar_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit version bump
        if: ${{ inputs.commit_version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle.properties; then
            echo "mod_version is already ${VERSION}, nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898083+github-actions[bot]@users.noreply.github.com"

          git add gradle.properties
          git commit -m "Set mod_version to ${VERSION}"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish:
    name: Publish to CurseForge
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (for changelog.md)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.jar_name }}
          path: dist

      - name: Upload to CurseForge
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          JAR_NAME: ${{ needs.build.outputs.jar_name }}
          MC_VERSION: ${{ needs.build.outputs.mc_version }}
          LOADER: ${{ needs.build.outputs.loader }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CHANGELOG_INPUT: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          API="https://minecraft.curseforge.com/api"
          JAR="dist/${JAR_NAME}"
          DISPLAY_NAME="${JAR_NAME%.jar}"

          [ -n "$CF_TOKEN" ]      || { echo "::error::Secret CURSEFORGE_TOKEN is not set"; exit 1; }
          [ -n "$CF_PROJECT_ID" ] || { echo "::error::Variable CURSEFORGE_PROJECT_ID is not set"; exit 1; }
          [ -f "$JAR" ]           || { echo "::error::Jar not found: $JAR"; ls -la dist; exit 1; }

          # ---- Changelog: input > matching section of changelog.md > default ----
          CHANGELOG=""
          if [ -n "$CHANGELOG_INPUT" ]; then
            CHANGELOG="$CHANGELOG_INPUT"
          else
            for f in changelog.md CHANGELOG.md; do
              if [ -f "$f" ]; then
                # Grabs the lines under "# 1.21.1-1.0.1" or "# 1.0.1" until the next heading
                CHANGELOG=$(awk -v a="${MC_VERSION}-${VERSION}" -v b="${VERSION}" '
                  { sub(/\r$/, "") }
                  /^#+[[:space:]]/ { if (found) exit; if ($2 == a || $2 == b) { found = 1; next } }
                  found { print }
                ' "$f")
                break
              fi
            done
          fi
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            CHANGELOG="${DISPLAY_NAME}"
          fi
          echo "Changelog:"
          echo "$CHANGELOG"

          # ---- Resolve CurseForge game version IDs ----
          TYPES=$(curl -fsS -H "X-Api-Token: $CF_TOKEN" "$API/game/version-types")
          VERSIONS=$(curl -fsS -H "X-Api-Token: $CF_TOKEN" "$API/game/versions")

          MC_TYPES=$(jq -c '[.[] | select(.slug | startswith("minecraft-")) | .id]' <<<"$TYPES")
          LOADER_TYPES=$(jq -c '[.[] | select(.slug == "modloader") | .id]' <<<"$TYPES")
          JAVA_TYPES=$(jq -c '[.[] | select(.slug == "java") | .id]' <<<"$TYPES")

          find_id() {
            jq -r --arg n "$1" --argjson t "$2" \
              'first(.[] | select(.name == $n and (.gameVersionTypeID as $g | $t | map(. == $g) | any)) | .id) // empty' \
              <<<"$VERSIONS"
          }

          MC_ID=$(find_id "$MC_VERSION" "$MC_TYPES")
          LOADER_ID=$(find_id "$LOADER" "$LOADER_TYPES")
          JAVA_ID=$(find_id "Java ${JAVA_VERSION}" "$JAVA_TYPES")

          [ -n "$MC_ID" ]     || { echo "::error::Minecraft version '$MC_VERSION' not found on CurseForge"; exit 1; }
          [ -n "$LOADER_ID" ] || { echo "::error::Loader '$LOADER' not found on CurseForge"; exit 1; }
          [ -n "$JAVA_ID" ]   || { echo "::error::'Java ${JAVA_VERSION}' not found on CurseForge"; exit 1; }

          echo "Game version IDs -> Minecraft: $MC_ID, Loader: $LOADER_ID, Java: $JAVA_ID"

          # ---- Metadata ----
          METADATA=$(jq -n \
            --arg changelog "$CHANGELOG" \
            --arg displayName "$DISPLAY_NAME" \
            --arg releaseType "$RELEASE_TYPE" \
            --arg deps "$CF_REQUIRED_DEPENDENCIES" \
            --argjson gameVersions "[$MC_ID, $LOADER_ID, $JAVA_ID]" \
            '
            ($deps | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))
                   | map({slug: ., type: "requiredDependency"})) as $projects
            | {
                changelog: $changelog,
                changelogType: "markdown",
                displayName: $displayName,
                releaseType: $releaseType,
                gameVersions: $gameVersions
              }
            + (if ($projects | length) > 0 then {relations: {projects: $projects}} else {} end)
            ')

          echo "Metadata:"
          echo "$METADATA"

          # ---- Upload ----
          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -H "X-Api-Token: $CF_TOKEN" \
            --form-string "metadata=$METADATA" \
            -F "file=@\"$JAR\";type=application/java-archive" \
            "$API/projects/$CF_PROJECT_ID/upload-file")

          echo "Response ($HTTP_CODE):"
          cat response.json; echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::CurseForge upload failed with HTTP $HTTP_CODE"
            exit 1
          fi

          FILE_ID=$(jq -r '.id' response.json)
          {
            echo "### Published to CurseForge :rocket:"
            echo ""
            echo "- **File:** ${JAR_NAME}"
            echo "- **Version:** ${VERSION} (${RELEASE_TYPE})"
            echo "- **CurseForge file ID:** ${FILE_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
